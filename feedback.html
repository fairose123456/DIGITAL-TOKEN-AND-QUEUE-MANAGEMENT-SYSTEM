<!DOCTYPE html>
<html>
<head>
    <title>User Feedback</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5fb;
            margin: 0;
        }

        header {
            background: #123c69;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            color: #123c69;
            text-align: center;
        }

        .feedback {
            border: 1px solid #ddd;
            padding: 18px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .name {
            font-weight: bold;
            color: #123c69;
        }

        .rating {
            color: #e69b00;
            font-size: 20px;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 12px 25px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>Digital Token & Queue Management System</h1>
    <p>User Feedback</p>
</header>

<div class="container">

    <h2>Customer Feedback</h2>

    <div class="feedback">
        <div class="name">User 1</div>
        <div class="rating">★★★★★</div>
        <p>The token system was easy to use and reduced waiting time.</p>
    </div>

    <div class="feedback">
        <div class="name">User 2</div>
        <div class="rating">★★★★☆</div>
        <p>The queue status was useful because I could check my position.</p>
    </div>

    <div class="feedback">
        <div class="name">User 3</div>
        <div class="rating">★★★★★</div>
        <p>The digital token process was simple and convenient.</p>
    </div>

    <button onclick="location.href='admin.html'">
        BACK TO ADMIN DASHBOARD
    </button>

</div>

</body>
</html>
